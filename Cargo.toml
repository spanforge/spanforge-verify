[package]
name = "spanforge-verify"
version = "0.1.0"
edition = "2024"
default-run = "spanforge-verify"
license = "MIT"
description = "Declarative CLI verification for Windows laptops and Linux containers"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.6"
regex = "=1.13.1"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
ctrlc = { version = "=3.5.2", features = ["termination"] }
uuid = { version = "=1.26.1", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "=3.27.0"
quick-xml = "=0.42.0"

[[bin]]
name = "spanforge-verify-fixture"
path = "src/bin/fixture.rs"

[[bin]]
name = "cliverifyr"
path = "src/bin/cliverifyr.rs"
