# Linux native executable; paths resolve against this suite's directory.
schema_version = 1
suite_id = "smoke"
program = 'bin/target'

[defaults]
timeout_ms = 5000
max_output_bytes = 1048576

[[cases]]
id = "help"
args = ["--help"]
[cases.expect]
exit_code = 0
[cases.stderr]
mode = "text_equals"
text = ""
